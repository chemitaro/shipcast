## この資料で分かること

:::summary
- `shipcast write` が、集める → まとめる → 書くを、どの順で通すか
- 書き手のモデルに何を渡し、何を書かせ、何を書かせないか
- できあがる日誌のMarkdownの形（前付けと囲みの順）
- `:::metrics` の4つの数の数え方
- iss-00019 が「発信の芽」を足すための拡張点
- 失敗したときに前の日誌を壊さない仕組みと、試験のしかた
:::

## 背景：日誌づくりの最後の段

shipcastは、登録したrepositoryで1日に起きたことを、開発日誌のMarkdownにします。日誌は3つの段で作ります。

:::cards cols=3
### 集める {badge=E2}
Git・SpecDock・Orcaから、その日の出来事（Event）を集めて状態に保存します。`main` に入り済みです。

### まとめる {badge=iss-00015}
関係する出来事を「話題（Story）」にまとめます。`analyze` の関数で、`main` に入り済みです。

### 書く {badge=iss-00016}
話題から日誌の文章を書かせ、ファイルにします。**このIssue**です。
:::

このIssueのコマンド `shipcast write --repo <id> --date <日付>` は、3つの段を1度に通します。夜に全repositoryを回す `shipcast run`（iss-00021）は、後でこの部品を使います。

:::note 先のIssueからの申し送り
- **iss-00015**：同じ日を分析し直すと、古い話題が状態に残ります。そこで、日誌には `analyze` が今回返した話題だけを書きます（`Store.stories_for` は使いません）。
- **iss-00017**：配信のページ（ds.js）は、前付けを独自に読みます。前付けは `write_frontmatter` の決まった形で書き、前付けにも本文にも生のHTMLを入れません。
:::

## 全体の流れ

```plantuml id=flow
@startuml
title shipcast write の1つのrepositoryの流れ
participant "CLI\n(write.run)" as C
participant "収集\n(collect_repo)" as K
database "状態\n(Store)" as S
participant "分析\n(analyze)" as A
participant "書き手\n(compose)" as W
participant "組み立て\n(build_entry)" as B
participant "置き換え\n(write_atomic)" as F
C -> K : その日を集める
K -> S : 出来事を保存
alt 収集に誤りがある
  C --> C : 書かずに失敗（終了コード1）
else 収集できた
  C -> S : events_for（その日の出来事）
  alt 出来事が0件
    C -> B : 前付けと1行だけ（モデルを呼ばない）
  else 出来事がある
    C -> A : 出来事
    A --> C : 話題の一覧（戻り値を使う）
    C -> W : 話題の骨組み
    W --> C : lead・要約・物語（Draft）
    C -> B : 話題・出来事・Draft
  end
  B --> C : 日誌のMarkdown
  C -> F : 一時ファイル → os.replace
  C -> S : save_entry（日誌の記録）
end
@enduml
```

どこかの段で失敗すると、そのrepositoryの日誌は書かず、標準エラーに理由を出して、次のrepositoryへ進みます。前の日誌のファイルは変わりません。

## 書き手に渡すものと書かせるもの

書き手のモデル（ふだんは Antigravity の Gemini）には、**話題の骨組みだけ**を渡します。出来事の本文、ネタポイント、出来事のIDは渡しません。話題にない事実を足させないためです。

:::columns
### 渡す入力（架空の値）
```json
{
  "repo": "demo-app",
  "date": "2026-11-26",
  "stories": [
    {"title": "日誌の書き手をつないだ",
     "what": "write のコマンドを足した",
     "why": "毎日の日誌を自動で作るため",
     "notice": ["設定に書き手の経路が要る"],
     "waiting": ["本物の経路での確かめ"]}
  ]
}
```

### 受け取る応答の形
```json
{
  "lead": "今日の要約の1〜2文",
  "summary": ["要約の1行", "…"],
  "story": "### 小見出し\n\n本文…"
}
```
:::

書き手が書くのは、`lead`（前付けの要約）、`summary`（要約の行）、`story`（今日の物語の本文）の3つだけです。囲み（`:::`）、`#`・`##` の見出し、数字は書かせません。「知っておくべきこと」と「待っていること」は、書き手に言い換えさせず、話題の `notice`・`waiting` をshipcastがそのまま並べます。

:::tip なぜ書き手にMarkdownの全文を書かせないのか
囲みの順や種類、`notice` の写し、生のHTMLが混じらないことを、モデルの出来に頼らずに保てるからです。書き手の仕事は「読み物の文章」に絞り、形はshipcastが決めます。
:::

### 応答の形の検査（parse_draft）

応答は `parse_draft` が検査します。崩れていれば、誤りの一覧（`previous_errors`）を添えて**1回だけ**頼み直します。2回とも崩れたら `WriteFailed` で失敗にします。時間切れなど経路そのものの失敗は、頼み直しません。

:::datatable 形の検査（design.cue の D-01）
| # | 確かめること |
|---|---|
| W-01 | JSONとして読める（前後の空白と ```` ```json ```` の囲みは除いてから読む） |
| W-02 | 全体が物 |
| W-03 | `lead` が1行・200文字以内で、`<`・`>` を含まない |
| W-04 | `summary` が1〜5行で、各行が1行・生のHTMLなし・`:::` で始まらない |
| W-05 | `story` に、行頭の `:::`、`#`・`##` の見出し、生のHTMLがない（`###` はよい） |
| W-06 | どの文字列もUTF-8に変換できる |
:::

「生のHTML」は、`<` の後に英字・`/`・`!`・`?` が続く並びです。`a < b` のような比べる式は通ります。

## できあがる日誌の形

ファイルは `<journal_dir>/<repo>/<年>/<YYYY-MM-DD>.md` です（`journal_path` が決めます）。

```markdown
---
title: demo-app の開発日誌 2026-11-26
lead: 書き手のモデルが書いた1〜2文
date: 2026-11-26
repo: demo-app
category: 開発日誌
analyst: codex/gpt-6.2-sol
writer: antigravity/gemini-4-neon
generated_at: 2026-11-27T03:02:11+09:00
schema: 1
---

:::summary 今日の要約
- 書き手のモデルが書いた要約の行
:::

:::warning あなたが知っておくべきこと
- 話題の notice（shipcastが並べる）
:::

## 今日の物語

### 小見出し
書き手のモデルが書いた読み物（です・ます調）

:::checklist あなたを待っていること
- 話題の waiting（shipcastが並べる）
:::

:::metrics
- 2 | merge
- 3 | commit
- 1 | 閉じたScope
- 2 | 新しい本人待ちのtodo
:::
```

:::steps
### 前付け
`write_frontmatter` だけで作ります。`title` は `<repo の id> の開発日誌 <日付>` です。
### 要約・物語
書き手が書いた `summary` と `story` を入れます。
### 知っておくべきこと・待っていること
話題の `notice`・`waiting` が1件もなければ、その囲みごと省きます。
### 数字
出来事から機械で数えます（次の節）。
### 拡張点の囲み
登録した部品の囲みを最後に足します（このIssueでは空）。
:::

shipcastが本文に入れる話題の文字列は、改行を空白にし、`&`・`<`・`>` を文字の参照（`&amp;`・`&lt;`・`&gt;`）に置き換えてから入れます。配信の部品（marked）は生のHTMLを通すため、ここで止めます。

### 出来事のない日

その日の出来事が0件なら、分析も書き手も呼ばず、前付けと「大きな動きはありませんでした。」の1行だけを書きます。モデルを呼んでいないので、前付けに `analyst`・`writer` は書きません。

## `:::metrics` の4つの数

数字は書き手に数えさせず、その日の出来事から機械で数えます。どの数が0でも、4行とも出します。

:::datatable 数え方（design.cue の D-03）
| 表示 | 数えるもの |
|---|---|
| `merge` | Git の merge のcommit |
| `commit` | Git の merge でないcommit |
| `閉じたScope` | SpecDock の Scope が閉じた出来事（`scope_closed`） |
| `新しい本人待ちのtodo` | その日に登録され、その日のうちに完了しなかった todo（`todo_open` のうち、同じIDの `todo_done` がないもの） |
:::

:::note 「本人待ちのtodo」を「新しい」に絞った理由
今開いているtodoの全件は、その日の出来事だけからは数えられません。日誌はその日の出来事だけを材料にするので、「その日に増えた分」を数えます。
:::

## 拡張点（iss-00019 の「発信の芽」のために）

おまけの段（iss-00019）は、ネタポイントがたまった話題について、日誌の末尾に「発信の芽」（`:::tip`）を足します。書く段の中を書き換えずに足せるよう、拡張点を用意します。

```python
class JournalExtension(Protocol):
    def render(self, repo_id, day, stories, events) -> str | None: ...

EXTENSIONS: tuple[JournalExtension, ...] = ()   # このIssueでは空
```

- 組み立ての最後（`:::metrics` の後）に、登録順に `render` を呼びます。
- `None` か空白だけを返した部品の分は足しません。
- 部品が例外を投げたら、その日の日誌は書かずに失敗にします。
- 出来事のない日は呼びません。

## 前の日誌を壊さない仕組み

日誌は、同じフォルダーの一時ファイル（`.<名前>.…tmp`）に書き、`fsync` してから `os.replace` で置き換えます。置き換えは一瞬で行われるので、読む側が途中まで書いたファイルを見ることはありません。途中で失敗したら一時ファイルを消し、前のファイルはそのまま残ります。

:::warning 失敗したときに残るもの
- 出来事：収集と分析の段で、モデルを呼ぶ前に状態に保存済みです。
- 話題：分析が成功していれば状態に保存済みです。
- 日誌のファイルと `entries` の記録：前のまま変わりません。

同じ日を実行し直せば、同じ材料から書き直せます。
:::

## 試験のしかた

試験では外部のモデルを呼びません。モデルの経路は `fake` で、`responder` が応答を決めます。`agy` も呼びません。

:::datatable 主な試験（plan.cue の tests）
| # | 確かめること |
|---|---|
| T-01〜T-03 | 書き手の応答の検査と、プロンプトの語 |
| T-04 | 見本の出来事から4つの数が合う |
| T-05 | 日誌の全文が期待の文字列と等しい。生のHTMLが参照に置き換わる |
| T-06 | 拡張点の囲みが `:::metrics` の後に足される |
| T-07 | 出来事のない日は前付けと1行 |
| T-08 | 置き換えに失敗しても前のファイルが残り、一時ファイルも残らない |
| T-09 | 書き手への依頼と1回の頼み直し、渡すのは骨組みだけ |
| T-10〜T-11 | 1日の流れと、各段の失敗で前の日誌が残る |
| T-12 | `shipcast write` のコマンド全体 |
:::

本物の経路（codex と antigravity）での確かめは、本人が手で実行するときだけです。

## このIssueでしないこと

- 夜の実行と `runs` の表への記録（iss-00021）
- 「発信の芽」の中身とネタポイントの帳簿（iss-00019）
- 日誌の一覧の表示（epic-00005）
- 公開の方針による絞り込み（epic-00006 以降）

要件・設計・計画の正本は、同じフォルダーの `requirement.cue`、`design.cue`、`plan.cue` です。
