## このIssueで作るもの

話題から、書き手のモデルで「要約＋読み物」の本文を書き、日誌のMarkdownを作ります。`shipcast write` のコマンドです。親のE3の説明資料に、全体の約束と背景があります。

:::summary 確かめる点
- 出来事のない日はモデルを呼ばず1行
- 書き手が失敗しても前のファイルを壊さない
- 話題にない事実を書かせない
:::

:::note 保証レベルと前提の更新（2026-11-26）
保証レベルは **`standard`** です。`:::metrics` の数は、書き手に数えさせず、入力に足した `events` から機械で数えます。日誌の末尾に囲みを足す拡張点（`JournalExtension`）を用意し、iss-00019 の「発信の芽」がそれを使います。
:::

要件・設計・計画の正本は、同じフォルダーの `requirement.cue`、`design.cue`、`plan.cue` です。
