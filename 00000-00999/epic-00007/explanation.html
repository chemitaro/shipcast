## この資料で分かること

:::summary
- `shipcast run` が1回で何をするか
- 重ねて動かない・重複しない仕組み
- launchdの登録と、外付けvolumeでの注意
:::

## `shipcast run`

:::steps
1. **lockを取る** — 前の実行が動いていれば、重ねずに終わる
2. **repositoryごとに処理** — 集める → まとめる → 書く。失敗は記録して次へ
3. **記録する** — 開始・終了・結果・誤りを状態に残す
:::

同じ日を何度実行しても、Eventは安定したIDで重複せず、日誌のファイルは置き換わるだけです。

## launchdの登録

`shipcast schedule install` が `~/Library/LaunchAgents/com.shipcast.nightly.plist` を書きます。毎日3時に、`uv tool install` で入れた `shipcast` の絶対pathで `run` を動かします。worktreeのcheckoutからは動かしません。

:::warning 外付けvolumeのrepository
launchdから動く処理は、macOSの許可（TCC）の確認の画面を出せません。外付けvolumeのrepositoryを読むには、動く実行ファイルに本人があらかじめフルディスクアクセスを与えます。読めないときは、直し方を実行の記録に残します。
:::

登録（`launchctl` での読み込み）は本人の環境への変更なので、本人が実行します。

## Issueの分担

:::steps
1. **iss-00021 shipcast run** — 全repositoryの処理、記録、lock、TCCの見分け
2. **iss-00022 launchdの登録** — plistの生成、install・uninstall、READMEの手順
:::
