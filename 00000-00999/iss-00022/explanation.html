## このIssueで作るもの

`shipcast schedule install|uninstall` で、毎日3時のlaunchdの登録を作り、外せるようにします。親のE6の説明資料に、全体の約束と背景があります。

:::summary 確かめる点
- plistに3時、shipcastの絶対path、ログの置き場が入る
- launchctlでの読み込みは本人が行う
:::

:::note 保証レベルと前提の更新（2026-11-26）
保証レベルは **`standard`** です。本人のmacOSに定期の実行を登録するplistを作るため、受け入れ条件と試験を全要件に付けました。`launchctl` の読み込みは本人が行います。
:::

要件・設計・計画の正本は、同じフォルダーの `requirement.cue`、`design.cue`、`plan.cue` です。
