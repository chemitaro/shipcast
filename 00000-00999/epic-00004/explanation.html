## この資料で分かること

:::summary
- 分析と執筆で、なぜ別のモデルを使うのか
- モデルの経路の部品と、試験での偽物の経路
- 日誌のMarkdownの形
- 失敗したときと、外部へ渡す情報の扱い
:::

## 2つのモデルの役割

:::columns
### まとめる：安いモデル
Codex（GPT-6.2 Sol。より安いモデルで足りるならそれ）が、出来事の一覧を読み、話題にまとめます。正確さが要り、量が多いので、安く厳密なモデルを使います。

### 書く：Gemini 4 Neon
Antigravity（`agy -p`）のGemini 4 Neonが、話題の骨組みから、日本語の読みやすい本文を書きます。文章の美しさが要るところだけに使います。
:::

## モデルの経路

:::datatable 経路の一覧
| 経路 | 使う場面 | 呼び方 |
|---|---|---|
| codex | 分析の既定 | `codex exec -m <model> --sandbox read-only -` |
| antigravity | 書き手の既定 | `agy -p … --output-format json`（道具は使わせない） |
| claude | 予備 | `claude -p --tools ""` |
| fake | 試験・予行 | 決まった応答を返す |
:::

正確な引数は、実装の最初に各コマンドの `--help` で確かめます。

:::danger エージェントの中からはAntigravityを呼ばない
Antigravityの規約は、第三者のエージェントやアプリで `agy` を包む使い方を、個人のプランで認めていません。環境変数 `CLAUDECODE` や `CODEX_` で始まるもの、Orcaの作業者の印があるときは、antigravity の経路は呼ばずに止まります。試験とハッカソンの作業者は fake の経路を使います。
:::

## 日誌のMarkdownの形

日誌は、SpecDockの説明資料と同じデザインシステムのタグを使うMarkdownです。

```markdown
---
title: shipcast の開発日誌 2026-11-26
lead: 今日の要約の1〜2文
category: 開発日誌
date: 2026-11-26
repo: shipcast
---

:::summary 今日の要約
- 3〜5行
:::

:::warning あなたが知っておくべきこと
- 方針に関わる変更、危うい点
:::

## 今日の物語
（です・ます調の読み物。話題ごとに小見出し）

:::checklist あなたを待っていること
- 本人待ちのtodo
:::
```

出来事のない日は、モデルを呼ばず「大きな動きはありませんでした。」の1行にします。

## 失敗と安全

:::risks
| リスク | 影響 | 起きやすさ | 対策 |
|---|---|---|---|
| モデルの呼び出しが失敗する | 中 | 中 | 話題と出来事を先に保存し、前の日誌を壊さずに次の実行で書き直す |
| 秘密情報がモデルに渡る | 高 | 低 | トークン・鍵・パスワードの行を、渡す前に伏せる |
| 書き手が事実を創作する | 中 | 中 | 骨組みだけを渡し、話題にない事実を書かないよう指示する |
| 分析のJSONの形が崩れる | 低 | 中 | 1回だけ頼み直し、だめなら失敗として記録する |
:::

## Issueの分担

:::steps
1. **iss-00014 モデルの経路** — 経路の部品、伏せる処理、エージェントの中の検出
2. **iss-00015 話題にまとめる** — 分析のプロンプトとJSON、保存
3. **iss-00016 日誌を書く** — 書き手のプロンプト、Markdownの組み立て、`shipcast write`
:::
