## この資料で分かること

:::summary
- E1が先に決める4つの約束（CLI、設定、データの形、状態）
- 設定ファイル `config.toml` の形と、repositoryの登録のしかた
- Event・Story・Entryの意味の違い
:::

## なぜ最初に作るのか

ハッカソンでは、Orcaの作業者が複数のIssueを同時に進めます。作業者どうしが同じ型と同じ置き場を使わないと、最後に統合できません。そこで、E1で約束を決め、mainに入れてから、ほかのEpicを始めます。

## 4つの約束

:::cards cols=2
### CLI {icon=terminal}
`shipcast` の下位のコマンド：`repo`、`collect`、`write`、`run`、`serve`、`draft`、`schedule`。中身は各Epicが作ります。

### 設定 {icon=file}
`~/.config/shipcast/config.toml`。登録したrepository、モデルの経路、配信、ネタポイントのしきい値。

### データの形 {icon=layers}
`shipcast.model` に、Event・Story・Entryの型を1か所だけ置きます。

### 状態 {icon=database}
`~/.local/state/shipcast/state.sqlite3`。同じ出来事を二度保存しても1件のままです。
:::

## データの形

:::glossary
- **Event**（イベント）: 出所（Git・SpecDock・Orca）から観測した1つの事実。commit、Scopeの終了、会話など
- **Story**（ストーリー）: 関係するEventをまとめた、人に伝える意味のある話題。何を・なぜ・知っておくべきこと・待っていること・ネタポイントを持つ
- **Entry**（エントリー）: 1つのrepositoryの1日の日誌のファイル
:::

## 設定の見本

```toml
schema = 1
timezone = "Asia/Tokyo"

[models.analyst]
route = "codex"
model = "gpt-6.2-sol"

[models.writer]
route = "antigravity"
model = "gemini-4-neon"

[[repos]]
id = "shipcast"
path = "/abs/path/to/shipcast"
ref = "main"
orca = true
```

`shipcast repo add <path>` は、SpecDockを使うrepository（`spec-dock/workspace.json` がある）だけを足します。

## Issueの分担

:::steps
1. **iss-00008 CLIの骨組み** — packageと試験・検査の土台
2. **iss-00009 設定と登録** — `config.toml` の読み込み、`repo add|list`
3. **iss-00010 型と状態** — Event・Story・Entry、SQLite
:::

iss-00009 と iss-00010 は、iss-00008 の後に同時に進められます。

## 確かめ方

```sh
uv run shipcast --help
uv run pytest -q
uv run ruff check
```
