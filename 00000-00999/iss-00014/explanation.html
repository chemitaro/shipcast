## このIssueで作るもの

分析と書き手のモデルを、設定の経路の名前（codex・antigravity・claude・fake）で呼び分ける部品と、伏せる処理を作ります。親のE3の説明資料に、全体の約束と背景があります。

:::summary 確かめる点
- 呼ぶ前に必ず秘密らしい文字列を伏せる
- エージェントの中では antigravity を呼ばずに止まる
- Codexのより安いモデルの名前を確かめる
:::

要件・設計・計画の正本は、同じフォルダーの `requirement.cue`、`design.cue`、`plan.cue` です。
