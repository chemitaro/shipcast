## このIssueで作るもの

`config.toml` を読み、SpecDockを使うrepositoryを `shipcast repo add|list` で登録・一覧できるようにします。親のE1の説明資料に、全体の約束と背景があります。

:::summary 確かめる点
- SpecDockのないrepositoryは足さない
- 同じidは二重に足さない
- 壊れた設定は、直し方を示して止まる
:::

:::note 保証レベルと前提の更新（2026-11-26）
保証レベルは **`standard`** です。設定ファイルの形はほかの全Issueが読む共通の約束なので、受け入れ条件と試験を全要件に付けました。
:::

要件・設計・計画の正本は、同じフォルダーの `requirement.cue`、`design.cue`、`plan.cue` です。
