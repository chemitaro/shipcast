## この資料で分かること

:::summary
- 表紙 `/` と一覧 `/<repo>/` に、何がどの順に並ぶか
- 日誌の置き場を、どう歩いて「日の一覧」を作るか（置き場の外を読まない守り）
- 日誌の前付けの値を、なぜ記号ごと文字参照にしてからMarkdownに入れるのか
- iss-00017 から引き継いだ `split_path` の末尾の `/` の扱い
- 誰が実装し、どう確かめるか（スマートフォンの幅を含む）
:::

## 背景

shipcastは、エージェントがその日の出来事から開発日誌を書く道具です。日誌は `<日誌の置き場>/<repo>/<年>/<日付>.md` のMarkdownのファイルとして、毎晩1日に1つずつ増えます。iss-00017 で `shipcast serve` ができ、`/<repo>/<YYYY-MM-DD>` で1日のページを読めるようになりました。

ただ、今は URL を手で打たないと日誌にたどり着けません。`/` と `/<repo>/` は404を返します。このIssueで、ブログの表紙と記事の一覧に当たる2つのページを足し、スマートフォンから日誌を「開いて選ぶ」だけで読めるようにします（親 epic-00005 の R-02）。

:::glossary
- **前付け**（frontmatter）: 日誌のファイルの先頭の `---` で囲んだ部分。`title`・`lead`（1文の要約）・`date`・`repo` を必ず持つ。
- **デザインシステム**: SpecDockが配る `ds.css`・`ds.js`。Markdownの中の `:::cards` などの部品を描く。
- **`:::cards`**: 見出しごとに1枚のカードを描く部品。見出しの末尾の `{href=…}` でカード全体がリンクになる。
- **`:::timeline`**: 箇条書きの項目を、左に日付、右に説明の時系列として描く部品。
- **文字参照**: `&#123;` のように、文字を番号で書く書き方。Markdownでは記号として解釈されず、その文字として見える。
:::

## 表紙 `/`

日誌の置き場の直下にある repository ごとに、**前付けを読める最も新しい日** を1枚のカードにします。カードは日付の新しい順、同じ日なら repository の名前の順です。カードを押すと、その日のページを開きます。その下に、各 repository の一覧へのリンクを並べます。

```markdown title="表紙のMarkdown（見本の置き場の場合）"
---
title: shipcast の日誌
lead: repositoryごとに、いちばん新しい日の日誌を並べています。
category: shipcast
---

## 最新の日誌

:::cards
## 見本の機能 A の試験を書いた {href=/demo-app/2026-11-27 badge=2026-11-27 more=この日を読む}
試験の書き方を決め、3つの場面を足しました。

demo-app の日誌
## 見本のライブラリの版を上げた {href=/sample-lib/2026-11-20 badge=2026-11-20 more=この日を読む}
依存を見直し、古い関数を外しました。

sample-lib の日誌
:::

## repositoryごとの一覧

- [demo-app](/demo-app/)
- [sample-lib](/sample-lib/)
```

:::note 日誌がまだ1つもないとき
置き場がない、または空のときも 200 を返し、カードの代わりに「まだ日誌がありません。日誌は `shipcast run` で、登録した repository ごとに1日に1つ作られます」と案内します。
:::

## 一覧 `/<repo>/`

その repository の日誌のある日を、すべて新しい順に並べます。月が変わるところに `2026年11月` のような見出しを置き、月ごとに1つの時系列にします。各項目は、日付（その日のページへのリンク）、題名、lead です。

```markdown title="一覧のMarkdown（demo-app の場合）"
---
title: demo-app の日誌
lead: demo-app の日誌を、新しい日から順に並べています（3日分）。
category: shipcast
---

[表紙へ戻る](/)

## 2026年11月

:::timeline
- **[2026-11-27](/demo-app/2026-11-27)** — **見本の機能 A の試験を書いた** 試験の書き方を決め、3つの場面を足しました。
- **[2026-11-26](/demo-app/2026-11-26)** — 前付けを読めないため要約を表示できません。
:::

## 2026年10月

:::timeline
- **[2026-10-31](/demo-app/2026-10-31)** — **見本の設計を始めた** 置き場の決め方を2案で比べました。
:::
```

:::tip 親の「日付と lead」に題名を足した理由
lead は1文の要約なので、似た日が続くと見分けにくくなります。題名を太字で前に置くと、一覧を流し読みするだけで1日を選べます（タスク担当の判断）。
:::

## 前付けの値を、記号ごと文字参照にする

日誌の題名と lead は、夜の実行でエージェントが commit の文や会話から書きます。そこには Markdown の記号や生のHTMLが混ざりえます。そのまま表紙のMarkdownに入れると、デザインシステムが **文字を入れる前に** 記号を解釈するので、ページの形が崩れます。

:::beforeafter
### そのまま入れた場合
題名が `直した {href=https://evil.example}` だと、カードの見出しの末尾の属性として読まれ、カードの行き先が外のサイトに変わりえます。lead が `## x` で始まると、カードが1枚増えます。`:::` の行は部品を途中で閉じます。
### 文字参照にした場合
ASCIIの記号32字（`{`・`}`・`#`・`:`・`*`・`[`・`<` など）を、すべて `&#123;` のような文字参照（`&` だけは `&amp;`）にしてから入れます。デザインシステムの正規表現にも Markdown にも記号として当たらず、画面ではもとの文字として見えます。
:::

:::decision 前付けの値は `markdown_text` を通した道だけで入れる status=案（仕様レビュー中） date=2026-11-26
### 決めたこと
`shipcast.page.markdown_text(value)` が、`string.punctuation` の32字を `&#NN;`（`&` だけは `&amp;`）に置き換えます。英数字・空白・日本語などはそのままです。表紙と一覧に前付けの値を入れるのは、この関数を通した道だけです。
### 理由
記号を1つずつ選んで逃がすと、デザインシステムの書き方（見出しの属性、部品の行、行の中の部品、`**…**`）が増えるたびに漏れが出ます。ASCIIの記号をすべて文字参照にすれば、どの書き方にも当たりません。
### 退けた案
バックスラッシュで逃がす方法は、見出しの末尾の `{…}` を読む ds.js の正規表現がバックスラッシュを見ないため、属性の注入を防げません。
:::

:::warning ブラウザーで確かめて改めた2点（2026-11-26）
- `&` を `&#38;` にすると、marked が `&#38;amp&#59;` を `&amp;` に戻して書き出し、題名の `&amp;` が `&` と見えました。`&` だけ `&amp;` にすると、`&amp;` の5字のまま見えます。
- カードのバッジに長い repository の名前を入れると、バッジが折り返さず、390px の幅で横にはみ出しました。バッジは日付だけにし、repository の名前はカードの本文（折り返す）に「demo-app の日誌」と書きます。
:::

日付と repository の名前は、道筋（ファイル名とディレクトリ名）から取り、記号は `-` だけなので、そのまま属性とリンクの先に入れます。

## 日誌の置き場を歩く

表紙と一覧は、要求のたびに日誌の置き場を歩きます（日誌は夜に増えるので、覚えておきません）。iss-00017 と同じく、**読むファイルはすべて `resolve_inside` で置き場の中と確かめます**。

:::steps
1. **repository を集める** — 置き場の直下で、名前が `REPO_ID_PATTERN`（英小文字・数字・`-`）に合い、置き場の中にあるディレクトリだけ。`.` で始まるもの、`Demo` のような名前、置き場の外への symlink は飛ばします。
2. **日のファイルを集める** — 名前が4桁の年のディレクトリの中の、`YYYY-MM-DD.md` で実在する日、かつ年がディレクトリと同じファイルだけ。新しい順に並べます。
3. **前付けを読む** — UTF-8で読み、`parse_journal` で前付けを読みます。読めなければ、配信の端末の標準エラーに1行を出し、その日を「読めない日」とします。
4. **ページを組む** — 表紙は、読めた最も新しい日を1つずつ取ります。一覧は、読めない日も固定の文で並べます。
:::

:::datatable 失敗と境界の条件
| 場面 | 動き |
|---|---|
| repository・年・日のファイルが置き場の外への symlink | 黙って飛ばす（中身を読まない） |
| `2026-02-30.md`、`2025/` の中の `2026-01-01.md`、`notes.txt` | 黙って飛ばす |
| 最新の日の前付けが壊れている | 表紙は次に新しい読める日を出す。一覧は固定の文で並べる |
| どの日も読めない repository | 表紙のカードには出さない（一覧へのリンクは出す） |
| 前付けの `date`・`repo` が道筋と違う | 道筋の値を使う（リンクの先と合わせる） |
:::

## iss-00017 からの申し送り：末尾の `/`

iss-00017 の `split_path` は、`/demo-app/` の最後の空の部分を拒んで `None` にしていました。このIssueでは、**最後の部分だけ** 空を許し、`("demo-app", "")` として返します。途中の空（`//x`、`/a//b`、`/demo-app//`）と、今までの検査（`..`、`%2f`、`%5c`、NUL など）はそのまま拒みます。`/_ds/` のように、デザインシステムの道筋の中に空の部分があるものは404です。

## 自動の試験
`markdown_text` の置き換え、表紙と一覧のMarkdownの形、敵対的な題名・lead でカードや項目が増えないこと、置き場を歩く関数、道筋と状態とヘッダーを `pytest` で確かめます。
## 実際のブラウザー
本物のデザインシステムで表紙と一覧を開き、カードと時系列が描けること、敵対的な題名が文字で見えること、390px と 1280px の幅で横にはみ出さないこと、CSPの違反がないことを確かめ、報告に記録します。
:::

## 誰がどう進めるか

:::flow
- **仕様** — タスク担当（Opus 5.5 / medium）
- **仕様レビュー** — `spec-reviewer`（Opus 5.5 / medium）
- **実装 S-01・S-02** — タスク担当が直接（本人の決定 20）
- **最終品質ゲート** — `quality-gate-reviewer`（Opus 5.5 / medium）
- **PRとCI** — タスク担当。マージは統括
:::

保証レベルは **`light`** です。影響は表紙と一覧の2つのページに閉じ、読むだけで日誌を変えず、PRを戻せば元に戻ります。要件・設計・計画の正本は、同じフォルダーの `requirement.cue`、`design.cue`、`plan.cue` です。
