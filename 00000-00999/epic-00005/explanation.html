## この資料で分かること

:::summary
- 表紙・一覧・各日の日誌の、3つのページと道筋
- Markdownを包むだけの薄いページの仕組み
- 配信の4つの防御（パスの検査、エスケープ、CSP、待ち受けの場所）
- ロジックはCodex、画面は Opus 5.5 という実装の分担
- E2・E3を待たずに、見本の日誌で並行に作れる理由

## 薄いページの仕組み

```plantuml id=wrap
@startuml
title 日誌のページが描かれるまで
actor "本人のブラウザー" as B
participant "shipcast serve" as S
participant "resolve_inside" as R
participant "wrap_markdown" as WM
collections "日誌のMarkdown" as MD
B -> S : GET /shipcast/2026-11-26
S -> R : 日誌の置き場の中か確かめる
R --> S : 中のパス（外なら404）
S -> MD : 読む
S -> WM : Markdownと題名
WM --> S : <\/script と <!-- を置き換えて包んだHTML
S --> B : HTML＋CSP＋nosniff
B -> S : GET /_ds/ds.css、/_ds/ds.js
S --> B : デザインシステム
B -> B : ds.js がMarkdownを描く（図はブラウザーの中で）
@enduml
```

包んだページ（設計の D-01）は、次の5つだけでできています。SpecDockの説明資料と同じ「薄い形」です。

:::steps
1. **`<head>` の基本** — `charset`、`viewport`、前付けの `title` を入れた `<title>`（HTMLとしてエスケープ）
2. **見た目** — `<link rel="stylesheet" href="/_ds/ds.css">`
3. **本文** — `<script type="text/markdown" id="ds-source">` の中に、置き換えた日誌のMarkdown
4. **描画** — `<script src="/_ds/ds.js">`。ブラウザーの中でMarkdownを部品と図に描く
5. **空の `<body>`** — 中身はすべて ds.js が作る
:::

デザインシステムは、このrepositoryに写さず、設定の `serve.design_system_dir`（空なら登録したrepositoryの `spec-dock/design-system/`）のファイルを `/_ds/` で配ります。

## 4つの防御

:::cards cols=2
### パスの検査 {icon=folder badge=F-02}
URLを復号してから `Path.resolve()` し、日誌（またはデザインシステム）の置き場の中かを `resolve_inside` の1か所で確かめます。`..`、`%2e%2e`、`%2f`、置き場の外へのsymlinkは、中身を読まずに404です。

### エスケープ {icon=code badge=F-03}
日誌の本文はcommitの文や会話から来るので、`<\/script` が混ざりえます。`wrap_markdown` の1か所で、`<\/script` を `<\/script`（ds.js が読むときに戻す）に、`<!--` を `<\!--` に置き換えます。

### CSPのヘッダー {icon=shield badge=F-04}
デザインシステムのMarkdownは生のHTMLを描くので、すべての応答にCSP（インラインのscriptとイベントの属性を止める）と `X-Content-Type-Options: nosniff` を付けます。

### 待ち受けの場所 {icon=globe badge=R-03}
既定は `127.0.0.1` だけで待ち受けます。tailnetへの公開は、本人が1回だけ `tailscale serve` を実行します。shipcastはTailscaleの設定を変えません。
:::

```text title="すべての応答に付けるCSP"
default-src 'self'; script-src 'self' https://unpkg.com;
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;
object-src 'none'; base-uri 'none'; frame-ancestors 'none'
```

:::note CSPとデザインシステム
図の部品（PlantUML）とコードの色分けは unpkg から読むので、`script-src` に unpkg を許します。描けないときは、要る最小の許可（例 `'wasm-unsafe-eval'`）だけを足し、scriptに `'unsafe-inline'` は許しません。実際のブラウザーで、見本の日誌の部品と図が描け、`<img onerror>` が動かないことを確かめます。
:::

## E2・E3と並行に作れる理由

E4は、日誌のパスと前付けの契約（E1の D-05）だけに頼ります。そのため、E3が本物の日誌を書く前に、契約どおりの **見本の日誌**（`tests/fixtures`、架空の内容）で、配信とページを作って確かめられます。E4の依存はE1だけです。

## 失敗したときの動き

:::risks
| リスク | 影響 | 起きやすさ | 対策 |
|---|---|---|---|
| 置き場の外のファイルが返る | 高 | 低 | `resolve_inside` の1か所で確かめ、試験で `..`・符号化・symlinkを試す |
| 日誌の文字列がページの中で動く | 高 | 低 | `<\/script` と `<!--` の置き換え、CSP、ブラウザーでの確かめ |
| デザインシステムが見つからない | 中 | 中 | 起動のときに確かめ、設定の書き方を示して止まる |
| デザインシステムが将来CSPに合わなくなる | 中 | 低 | 試験とブラウザーでの確かめで気づく |
:::
