## この資料で分かること

:::summary
- HTMLを保存せず、Markdownを配信のときに描く理由
- 3種類のページ（表紙・一覧・各日）
- Tailscaleで読むまでの手順
:::

## なぜHTMLを保存しないのか

日誌の正本はMarkdownの1か所にします。HTMLを保存すると、同じ中身が2つになり、デザインを直すたびに全部を作り直すことになります。shipcastは、SpecDockの説明資料と同じ薄い形で、配信のときにMarkdownを包んで返します。

:::beforeafter
### 保存する形
日誌を書くたびにHTMLを作る。デザインの更新で全ファイルを作り直す。

### 描く形（採用）
Markdownだけを保存し、`shipcast serve` が返すときに包む。デザインシステムの更新はすぐ全部に効く。
:::

## 3種類のページ

:::cards cols=3
### 表紙 `/` {icon=book}
全repositoryの最新の日誌が、カードで並びます。

### 一覧 `/<repo>/` {icon=calendar}
そのrepositoryの日誌が、新しい順に日付とleadで並びます。

### 各日 `/<repo>/<日付>` {icon=file}
1日の日誌の本文。summaryやwarningのタグが部品として描かれます。
:::

デザインシステム（`ds.css`、`ds.js`）は、登録したrepositoryの `spec-dock/design-system/` から `/_ds/` で配ります。shipcastのrepositoryには写しません。

## Tailscaleで読む

:::steps
1. **配信を立てる** — `shipcast serve`（既定で 127.0.0.1:8765）
2. **tailnetに出す** — 本人が1回だけ `tailscale serve --bg 8765` を実行する（Tailscaleの設定は本人が変える）
3. **読む** — スマートフォンやほかのPCから、tailnetのURLを開く
:::

## Issueの分担

:::steps
1. **iss-00017 配信と日誌のページ** — 包む関数、配信の部品、Tailscaleの手順
2. **iss-00018 表紙と一覧** — 前付けを読み、cardsとtimelineのMarkdownを組む
:::

E4はE1の後に、見本の日誌を使って、E2・E3と並行に作れます。
