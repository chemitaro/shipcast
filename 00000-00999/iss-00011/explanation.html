## このIssueで作るもの

collectorの約束と `shipcast collect` を作り、その日に正本のbranchに入ったcommitとmergeを集めます。親のE2の説明資料に、全体の約束と背景があります。

:::summary 確かめる点
- 読むだけの操作で集める
- Gitでないpathは失敗として記録する
:::

:::note 保証レベルと前提の更新（2026-11-26）
保証レベルは **`standard`** です。`shipcast.collect.base` の共通の約束は、SpecDockとOrcaの収集（iss-00012、iss-00013）が依存する境界です。iss-00012 はこのIssueの後に始めます。
:::

要件・設計・計画の正本は、同じフォルダーの `requirement.cue`、`design.cue`、`plan.cue` です。
