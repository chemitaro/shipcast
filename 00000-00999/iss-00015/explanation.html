## この資料で分かること

:::summary
- 日誌づくりの3つの段のうち、このIssueがどこを受け持つか
- `analyze` の関数が、出来事を受け取ってから話題を返すまでの流れ
- 分析のモデルに渡すJSONと、受け取るJSONの形
- 応答の形の検査（V-01〜V-08）と、1回だけの頼み直し
- 2回とも崩れたとき・経路が失敗したときに、何が残り、何が返るか
- 外部のモデルを呼ばずに、どう試験するか
:::

## 背景：集める → まとめる → 書く

shipcastは、登録したrepositoryで1日に起きたことを集め、日誌にします。日誌は3つの段で作ります。

:::cards cols=3
### 集める {icon=list badge=E2}
Git・SpecDock・Orcaから、その日の出来事（Event）を集めて状態に保存します。`main` に入り済みです（iss-00011〜iss-00013）。

### まとめる {badge=iss-00015}
関係する出来事を「話題（Story）」にまとめ、ネタポイントを付けます。**このIssue**です。

### 書く {badge=iss-00016}
話題の骨組みから、書き手のモデルが日誌の本文を書きます。このIssueの戻り値を使います。
:::

モデルの呼び出しは、iss-00014 で作った共通の入口 `GuardedRoute.complete` を通します。この入口が、送る前に秘密情報らしい文字列を `[伏せた]` に置き換え、エージェントの中から `agy` を呼ばない守りを掛けます。このIssueは、その入口だけを使います。

:::note 「話題」とは
1つの話題は、同じ目的の出来事の集まりです。たとえば「Issueを作った」「その実装のcommit」「そのPRのmerge」の3件は、「出来事を話題にまとめる機能を作った」という1つの話題になります。話題には、何をしたか（`what`）、なぜか（`why`）、人が知っておくべきこと（`notice`）、人を待っていること（`waiting`）、発信の向き不向き（ネタポイント `neta`）が付きます。
:::

## 全体の流れ

```plantuml id=flow
@startuml
title analyze(events, route, store=..., repo_id=..., day=...) の流れ
participant "呼ぶ側\n(iss-00016 の write)" as W
participant "analyze\n(analyze.py)" as A
database "Store\n(state.sqlite3)" as S
participant "GuardedRoute\n(models.py)" as R
W -> A : その日の出来事
alt 出来事が0件
  A --> W : []（モデルを呼ばない）
else 出来事がある
  A -> S : add_events（呼ぶ前に材料を保存）
  A -> R : complete(入力のJSON, system=analyze.md, want_json=True)
  R --> A : 応答
  A -> A : parse_stories で形を検査
  opt 形の誤りがある（1回目だけ）
    A -> R : complete(入力のJSON + previous_errors)
    R --> A : 応答
    A -> A : parse_stories で形を検査
  end
  alt 形に合った
    A -> S : save_stories（返す前に保存）
    A --> W : list[Story]
  else 2回とも形が合わない
    A --> W : AnalyzeFailed（話題は保存しない）
  end
end
@enduml
```

## 渡すJSONと受け取るJSON

prompt の全体は1つのJSONの物にし、指示は system（`prompts/analyze.md`）に書きます。こうすると、伏せる処理がJSONの構造をたどって、値ごとに秘密を伏せられます（iss-00014 の申し送り）。

:::columns
### 渡す入力（架空の値）
```json
{
  "repo": "demo-app",
  "date": "2026-11-26",
  "events": [
    {"id": "a1b2…", "source": "git",
     "kind": "merge",
     "at": "2026-11-26T10:00:00+09:00",
     "title": "Merge pull request #3",
     "body": "", "refs": ["#3"],
     "actor": "dev"}
  ]
}
```

### 受け取る応答の形
```json
{
  "stories": [
    {
      "title": "話題の短い名前",
      "what": "何をしたか",
      "why": "なぜしたか",
      "notice": ["人が知っておくべきこと"],
      "waiting": ["人を待っていること"],
      "neta": {"score": 2,
               "reason": "点の理由",
               "channels": ["x"]},
      "event_ids": ["a1b2…"]
    }
  ]
}
```
:::

話題の `id`・`repo_id`・`date` は、モデルに書かせず、shipcastが機械で付けます。`id` は、元の出来事のIDの集まりから決まる `story_id(repo_id, day, event_ids)` です。

## ネタポイントの基準

ネタポイント（`neta.score`）は、その話題がX・note・Redditなどへの発信の芽になるかの点です。0〜3の整数で、プロンプトに次の3つの基準を書きます。

:::datatable ネタポイントの基準
| 基準 | 見るところ |
|---|---|
| 変化の大きさ | 機能の追加や方針の変更のように、前と後で何が変わったか |
| 読者への価値 | ほかの開発者が読んで、学びや参考になるか |
| 見せやすさ | 画面・数字・短い説明で、外の人に伝えやすいか |
:::

点は、おまけの段（iss-00019）がたまったポイントとして数え、発信の下書きを作るきっかけにします。このIssueは点を付けて保存するだけで、帳簿（`neta_ledger`）には書きません。

## 形の検査と頼み直し

応答は `parse_stories` が検査します。誤りは「場所: どう直すか」の日本語の文にし、応答の値は写しません。

:::datatable 形の検査（design.cue の D-02）
| # | 確かめること |
|---|---|
| V-01 | JSONとして読める（前後の空白と、全体を囲む ```` ```json ```` の囲みは除いてから読む） |
| V-02 | 全体が物で、`stories` が配列 |
| V-03 | `stories` が1件以上 |
| V-04 | `title`・`what`・`why` が空白だけでない文字列 |
| V-05 | `notice`・`waiting` は文字列の配列（省けば空） |
| V-06 | `neta.score` が0〜3の整数（`true`・`1.5`・`"2"` は不可） |
| V-07 | `event_ids` が1件以上で、どれも入力の出来事のID、重ならない |
| V-08 | 1つの出来事は1つの話題にだけ入る |
:::

1回目の応答に誤りがあれば、同じ入力に `previous_errors`（誤りの一覧）を足して、**もう1回だけ**頼みます。呼び出しは最大2回です。知らない鍵は誤りにせず捨てます。出来事がどの話題にも入らないことは許します（小さな出来事を落としてよい。日誌の数字は、書く段が出来事から数えます）。

## 失敗したとき

:::warning 2回とも形が合わないとき
`AnalyzeFailed` を投げます。文は「分析の応答が2回とも決まった形になりませんでした：…」で、最後の応答の誤りを添え、応答の本文は含みません。話題は保存しません。出来事はモデルを呼ぶ前に保存してあるので、同じ日を実行し直せば、同じ材料から分析し直せます。
:::

:::datatable 何が残り、何が返るか
| 場合 | 呼び出し | 返るもの | 話題の保存 | 出来事 |
|---|---|---|---|---|
| 出来事が0件 | 0回 | `[]` | しない | ― |
| 1回目で形に合う | 1回 | `list[Story]` | する（返す前） | 残る |
| 2回目で形に合う | 2回 | `list[Story]` | する（返す前） | 残る |
| 2回とも形が合わない | 2回 | `AnalyzeFailed` | しない | 残る |
| 経路の失敗（時間切れ・拒否など） | 1回 | `RouteError` をそのまま | しない | 残る |
:::

実行の記録（`runs` の表）には、このIssueでは書きません。`shipcast run`（iss-00021）が、repositoryごとの成功と失敗を、この例外の文から記録します。経路の失敗を頼み直さないのは、時間切れ（既定10分）を繰り返すと待ち時間と費用が倍になるからです。

## 試験の方法

外部のモデルは呼びません。`fake` の経路に `responder`（試験が応答を決める関数）を渡し、受け取った prompt・system・`want_json` と呼ばれた回数を記録します。状態は一時ディレクトリの `Store` を使い、出来事と話題はすべて架空の値です。

:::datatable 試験（plan.cue の T-01〜T-08）
| 試験 | 確かめること |
|---|---|
| T-01 | 応答から話題ができ、各項目と `id`・`repo_id`・`date` が合う |
| T-02 | 1回目が壊れていれば、誤りを添えて2回目を頼む |
| T-03 | 2回とも壊れれば `AnalyzeFailed`、話題は保存されず、出来事は残る |
| T-04 | 返る前に話題が保存され、呼ぶ前に出来事が保存されている |
| T-05 | V-01〜V-08 の誤りの表と、誤りの件数の上限 |
| T-06 | 経路の失敗は頼み直さず、そのまま上がる |
| T-07 | プロンプトのファイルが読め、基準の語を含む |
| T-08 | 出来事0件ではモデルを呼ばない、別のrepositoryの出来事は拒む |
:::

## 実装の進め方

:::steps
1. **S-01 プロンプトと形の検査**：`prompts/analyze.md` と `parse_stories` を、試験を先に書いて作る。
2. **S-02 analyze と頼み直し、失敗**：`analyze`・`MAX_ATTEMPTS`・`AnalyzeFailed` を作る。
3. **S-03 保存**：呼ぶ前の `add_events` と、返す前の `save_stories` を足す。
:::

実装は Codex（GPT-6.2 Sol / medium）の実装担当が、TDD（Red → Green）で行います。区切りのレビューは置かず、最後に最終品質ゲート（`quality-gate-reviewer`、Opus 5.5 / medium）と全試験を通します。マージは統括が行います。

## 後の段への申し送り

:::note 同じ日の分析し直し
同じ日を分析し直して話題の分け方が変わると、前の話題が状態に残り、`stories_for` が古い話題も返します。書く段（iss-00016）は `analyze` の**戻り値**を使ってください。古い話題の消し方は、`shipcast run` の再実行（iss-00021）かネタポイントの帳簿（iss-00019）を作るときに決めます。
:::

要件・設計・計画の正本は、同じフォルダーの `requirement.cue`、`design.cue`、`plan.cue` です。
