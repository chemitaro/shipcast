## このIssueで作るもの

shipcast は、毎日の開発の出来事を「話題」にまとめて日誌を書きます。話題には **ネタポイント**（0〜3点。外へ発信する値打ちの目安）が付き、repository ごとの台帳にたまります。たまった分がしきい値以上になると、日誌の末尾に「発信の芽」の囲みが出ます（前の iss-00019）。

このIssueでは、その「芽」を実際の **Xの投稿の下書き** にするコマンドを作ります。

```sh
shipcast draft x --repo demo-app
```

1. 未消化の話題から、点数の大きい順に **最大3件** を選ぶ。
2. 設定の **書き手のモデル** に、話題の題名・何をしたか・なぜか だけを渡し、Xの本文とハッシュタグの案を頼む。
3. 状態の置き場の `drafts/demo-app/2026-11-26-x.md` に下書きを置く。
4. 置けた後に、使った話題を **消化済み** にする（台帳の残高が減る）。

:::summary 確かめる点
- 投稿の全体（本文＋ハッシュタグ）が、Xの数え方で280以内（日本語なら140字程度）
- 本文に URL と `@` の宛先が入らない
- 下書きを置けたときだけ、使った話題が消化済みになる
- 外へは何も投稿しない
:::

これは親の epic-00006（E5 おまけ）の R-03 です。本人の決定（2026-11-26 の 17）で、ハッカソンでは「ネタポイントの印とXの下書き1本」までを作ります。note・Reddit は後に回します。

:::warning shipcastは投稿しません
shipcast には、X などへ投稿する経路そのものがありません。下書きのファイルの先頭にも「本人が確かめて投稿する」旨の注意を書きます。投稿は、本人が内容を確かめてから手で行います（`AGENTS.md` の「外へ投稿しない」）。
:::

:::note 保証レベル
保証レベルは **`light`** です。手元にファイルを1つ作るだけで、外へは送りません（書き手のモデルへの送信は、日誌を書くときと同じ経路と伏せ字の守りを通ります）。誤っても下書きを消せば元に戻ります。
:::

## 言葉

| 言葉 | 意味 |
|---|---|
| 話題（`Story`） | 分析のモデルが、その日の出来事をまとめた単位。題名・何をしたか・なぜか・ネタポイントを持つ |
| 台帳（`neta_ledger`） | 話題ごとに、点数と「消化済みか」を記録する表 |
| 未消化の話題 | 台帳で、まだ消化済みでなく、点数が1以上の話題（`Store.unconsumed_stories`） |
| 消化 | 下書きに使った話題を、台帳で消化済みにすること。残高から外れ、次の下書きには出ない |
| 書き手 | 設定の `models.writer` の経路（日誌の文章を書くのと同じモデル）。試験では `fake` |
| Xの数え方 | Xの文字数の数え方。日本語・絵文字などは1字を2、英数字と一部の記号は1と数え、上限は280 |

## 流れ

```plantuml
@startuml
title shipcast draft x の流れ
actor 本人
participant "shipcast draft x\n(run_x)" as Cli
participant "make_x_draft" as Make
database "状態の置き場\n(Store)" as Store
participant "compose_x" as Compose
participant "書き手の経路\n(GuardedRoute)" as Writer
本人 -> Cli : --repo demo-app [--date]
Cli -> Make : store, repo, 日付, 書き手
Make -> Make : 同じ日付の下書きがあれば止める
Make -> Store : unconsumed_stories(limit=3)
alt 話題がない
  Make --> Cli : NoStories（モデルを呼ばない）
else 話題がある
  Make -> Compose : 話題（題名・何を・なぜ）
  Compose -> Writer : prompts/x.md と入力のJSON
  Writer --> Compose : {"text", "hashtags"}
  Compose -> Compose : 検査（長さ・URL・宛先・ハッシュタグ）\n誤りなら1回だけ頼み直す
  Compose --> Make : XDraft
  Make -> Make : drafts/<repo>/<日付>-x.md を\n置き換えで書く
  Make -> Store : consume_neta(使った話題)
  Make --> Cli : 道筋・長さ・件数
end
Cli --> 本人 : 下書きの道筋と\n「shipcastは投稿しません」
@enduml
```

### 1. 話題を選ぶ

`Store.unconsumed_stories(repo_id, limit=3)`（iss-00019 で足したもの）で、点数の大きい順に最大3件を選びます。日誌の「発信の芽」に並ぶ題名と同じ並びです。残高がしきい値未満でも、本人が明示に頼んだときは、未消化の話題があれば作ります。

### 2. 書き手に頼む

書き手に渡すのは、選んだ話題の `title`・`what`・`why` と、repository の id・日付だけです。本人だけが読む「あなたが知っておくべきこと」（`notice`）・「あなたを待っていること」（`waiting`）・出来事の中身は渡しません。外へ出す文章の材料を、最初から小さく絞るためです。

指示は新しいプロンプト `src/shipcast/prompts/x.md` に書きます。応答は次の JSON だけです。

```json
{"text": "日誌を書く道具に、話題の点数をためる台帳を足しました。たまったら日誌に「発信の芽」が出ます。", "hashtags": ["#shipcast", "#個人開発"]}
```

### 3. 応答を検査する

| 項目 | 規則 |
|---|---|
| `text` | 空でない。改行は可、`\r` などの制御文字は不可。`http://`・`https://` と `@名前` を含まない |
| `hashtags` | 0〜3個。`#` で始まる1語（空白なし）。数字だけ（`#123`）は不可。重複なし |
| 長さ | 本文と空行とハッシュタグをつないだ **投稿の全体** が、Xの数え方で280以内 |

誤りがあれば、その一覧（応答の値は写さない）を `previous_errors` として添えて、**1回だけ** 頼み直します。2回とも誤りなら、下書きを置かず、話題も消化せずに止まります。

:::tip Xの数え方
X は、多くの言語の文字を「2」と数えます。shipcast は、X が公開している数え方の要点に合わせ、Unicode の正規化（NFC）の後、U+0000〜U+10FF（英数字やラテン文字など）と一部の記号（U+2000〜U+200D、U+2010〜U+201F、U+2032〜U+2037）を1、ほかを2と数えます。日本語の140字はちょうど280です。URL は許さないので、URL の短縮の数え方は持ちません。
:::

### 4. 下書きを置き、話題を消化する

下書きは、状態の置き場（設定の `state_dir`、既定 `~/.local/state/shipcast`）の下に置きます。日誌の置き場ではないので、`shipcast serve` は配りません。

```markdown
# Xの下書き（demo-app 2026-11-26）

:::note
shipcastは投稿しません。内容を確かめてから、本人が投稿してください。
:::

## 投稿の本文

日誌を書く道具に、話題の点数をためる台帳を足しました。たまったら日誌に「発信の芽」が出ます。

#shipcast #個人開発

## 確かめること

- 長さ：Xの数え方で 113 / 280
- ハッシュタグの案：#shipcast #個人開発
- 書き手：fake/fake-writer
- 作った時刻：2026-11-26T22:00:00+09:00

## 使った話題

- ネタポイントの台帳を足した
- 日誌に発信の芽の印を出した
```

ファイルは同じフォルダーに書き終えてから置き換えます（日誌と同じ `write_atomic`）。**置けた後にだけ** `consume_neta` で使った話題を消化済みにします。

## 失敗したとき

| 起きること | 動き |
|---|---|
| 同じ日付の下書きがすでにある | モデルを呼ばず、上書きせず、消化もせず、終了コード1。消すか、別の `--date` を使うよう示す。上書きすると、先に消化した話題の下書きが失われるため |
| 未消化の話題がない | モデルを呼ばず、ファイルを作らず、終了コード1。`shipcast write` で日誌を書くと話題がたまる旨を示す |
| 書き手の応答が2回とも形に合わない | 下書きを置かず、消化せず、終了コード1で誤りの箇所を示す |
| 書き手の経路が失敗する（`agy` をエージェントの中で呼んだ、など） | 頼み直さず、消化せず、終了コード1 |
| 下書きを置けない（書き込めない） | 一時ファイルを消し、消化せず、終了コード1 |
| 下書きを置いた後、消化で落ちる | 下書きはあり、話題は未消化のまま残る（残る危険。同じ日付では再実行が止まるので、二重の下書きにはならない） |

## コマンドの形

| 引数 | 意味 |
|---|---|
| `--repo ID` | 必須。`shipcast repo add` で登録した repository の id |
| `--date YYYY-MM-DD` | 下書きのファイル名の日付。既定は設定のタイムゾーンでの今日。話題は日付を問わず未消化のものから選ぶ |

成功すると、標準出力に次の2行が出ます。

```text
demo-app 2026-11-26: Xの下書きを作りました（話題 2件、Xの数え方で 113 / 280）: /…/drafts/demo-app/2026-11-26-x.md
shipcastは投稿しません。内容を確かめてから、本人が投稿してください。
```

## 作るもの・作らないもの

| 作る | 作らない |
|---|---|
| `src/shipcast/draft.py`（新規） | 外部への投稿、投稿の API、認証情報 |
| `src/shipcast/prompts/x.md`（新規） | note・Reddit の下書き（後に回す） |
| `cli.py` の `draft x` の配線（最小の差分） | 公開範囲・NGワードの設定による絞り込み（設定に項目がまだない） |
| 試験 `tests/test_draft.py`（新規）、`tests/test_cli.py` の1行 | 下書き・承認・投稿済みの状態の区別と確認の画面 |
| | `shipcast run`・`schedule` からの呼び出し、`Store`・表の形の変更 |

:::warning 並行の iss-00021 への申し送り
`shipcast run`（iss-00021）も `cli.py` と `tests/test_cli.py` の未実装の一覧を直します。このIssueは、`draft` の import の1行、`draft x` の `Entry` の1行、未実装の一覧の `("draft x", "iss-00020")` の1行だけを変えます。隣り合う行が両方で変わると、後にマージする側で小さな衝突が出ることがあります。
:::

## 残る危険

- **公開の方針の絞り込みがまだない。** 構想の「公開範囲・NGワード」の設定がまだないので、書き手に渡す項目を `title`・`what`・`why` に絞り、経路の伏せ字と、本人の目視に任せます。下書きは本人が確かめてから投稿します。
- **消化を戻すコマンドがない。** 下書きを捨てても、使った話題は消化済みのままです（台帳の `consumed` を0にすれば戻ります）。
- **Xの数え方は要点だけ。** X の実際の数え方と、ごく一部の文字で食い違うことがあります。投稿の画面で最後に確かめます。

## 確かめ方

試験は fake の経路の `responder` と一時ディレクトリだけで行い、外部のモデルと `agy` を呼びません。

| 試験 | 確かめること |
|---|---|
| T-01 | Xの数え方（英数字1・日本語2・正規化）と、応答の検査の各規則。誤りの文に応答の値を写さない |
| T-02 | 書き手に渡す入力が題名・何を・なぜだけで、形の誤りで1回だけ頼み直す。プロンプトが package に入る |
| T-03 | 下書きのファイルの形、上位3件の消化と残高、同じ日付・話題なし・書き手の失敗・書き込みの失敗で消化しないこと |
| T-04 | CLI の `shipcast draft x` の成功・二度目・未登録・話題なし・失敗の終了コードと出力 |

検証のコマンドは `uv sync --locked`、`uv run ruff check`、`uv run pytest -q` の順です。要件・設計・計画の正本は、同じフォルダーの `requirement.cue`、`design.cue`、`plan.cue` です。
