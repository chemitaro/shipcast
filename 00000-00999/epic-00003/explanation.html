## この資料で分かること

:::summary
- 3つの出所から何を集めるか
- 対象のrepositoryを書き換えないための読み方
- Orcaがないときの動き
:::

## 3つの出所

:::compare
| | Git | SpecDock | Orca |
|---|---|---|---|
| 必須か | ✓ 必須 | ✓ 必須 | △ 任意（本人は使う前提） |
| 集めるもの | 正本のbranchに入ったcommitとmerge | 作られた・閉じたScope、本人待ちのtodo | そのrepositoryでの本人とエージェントの会話 |
| 読み方 | `git --no-optional-locks log` | `spec-dock … --json` | `orca` のCLI（`--json`） |
| 読めないとき | そのrepositoryを失敗として記録 | 同じ | 警告だけ残して続ける |
:::

作業用のworktreeとbranchの、まだ統合されていないcommitは集めません。日誌に載るのは、その日にmainへ入った成果です。

## collectorの約束

すべての出所は、同じ形の部品です。

```python
class Collector(Protocol):
    name: str
    def collect(self, repo: RepoConfig, day: date) -> CollectResult: ...
    # CollectResult = events: list[Event], warnings: list[str]
```

`shipcast collect --repo <id> --date <日付>` が全部の部品を呼び、Eventを状態に保存します。

:::warning 書き換えない
`git fetch`、checkout、indexを書き換える操作は使いません。SpecDockとOrcaは、CLIの機械向けの出力だけを読み、内部のファイルの形を解釈しません。
:::

## Issueの分担

:::steps
1. **iss-00011 Git** — collectorの約束、`shipcast collect`、Gitの部品
2. **iss-00012 SpecDock** — Scopeとtodoの変化
3. **iss-00013 Orca** — 会話の記録。最初に、Orca CLIでpathと時刻で絞って読む方法を確かめる
:::

## 確かめ方

shipcast自身のrepositoryで `shipcast collect --repo shipcast --date <今日>` を動かし、3つの出所のEventが状態に入ることを見ます（Orcaは動いていれば）。
