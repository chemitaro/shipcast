## この資料で分かること

:::summary
- ネタポイントとは何で、どうたまり、どう消化されるのか
- 「発信の芽」の囲みが、書く段の中を書き換えずに日誌に足される仕組み（拡張点）
- Xの下書きの作り方と、外へ送らない約束
:::

## ネタポイント

分析のモデル（E3の iss-00015）は、話題ごとに **ネタポイント**（`neta.score`、0〜3）を付けます。基準は、変化の大きさ、読者への価値、見せやすさです。E5は、この点数を repositoryごとの台帳にため、たまった分で発信を促します。

```plantuml id=ledger
@startuml
title ネタポイントの台帳の流れ
[*] --> 未消化 : 話題を保存したときに点数を足す
未消化 --> 未消化 : 次の日の話題の点数も足す
未消化 --> 印が出る : 未消化の合計がしきい値（既定6）以上
印が出る --> 消化済み : shipcast draft x で下書きに使う
消化済み --> [*]
@enduml
```

:::keyvalue cols=1
- 台帳 | `neta_ledger`（話題のid、点数、消化済みか）。同じ話題は二度足さない
- 残高 | `neta_balance(repo)` は未消化の合計
- しきい値 | 設定の `neta.threshold`（既定6）
:::

## 「発信の芽」の印と拡張点

E3の書く段（iss-00016）は、日誌の末尾に囲みを足す **拡張点**（`JournalExtension`）を持ちます。E5の iss-00019 は、そこに部品を1つ登録するだけです。書く段の中は書き換えません。

```plantuml id=ext
@startuml
title 拡張点に「発信の芽」を登録する
hide empty members
interface JournalExtension {
  render(repo, day, stories, events) : str | None
}
class NetaSprout {
  しきい値以上なら囲みを返す
  未満なら None
}
class build_entry
JournalExtension <|.. NetaSprout
build_entry ..> JournalExtension : 末尾に足す（shipcast.write.EXTENSIONS）
note right of NetaSprout : iss-00019 が登録する
@enduml
```

```markdown title="日誌の末尾に足される囲み"
:::tip 発信の芽（ネタポイント 7）
- CLIの骨組みが一晩で入った話
- 収集の依存を整理して並行に進めた話
:::
```

そのため、iss-00019 は iss-00016 の後に始めます（2026-11-26 に依存を追加）。

## Xの下書き

:::terminal title="Xの下書きを作る（投稿はしない）"
$ uv run shipcast draft x --repo shipcast
# 未消化の話題から上位を選び、書き手のモデルで本文とハッシュタグの案を作る
# 下書きは ~/.local/state/shipcast/drafts/shipcast/2026-11-26-x.md
:::

:::warning 外へ送らない
- 下書きは状態の置き場の `drafts/` にMarkdownで置くだけです
- X・note・Redditなどへ投稿する処理は、shipcastにありません。投稿は本人が手で行います
- 下書きに使った話題は消化済みになり、次の印の合計から外れます
- 本文は日本語で140字程度（Xの280字の上限の内側）です
:::

## Issueの分担

:::steps
1. **iss-00019 台帳と日誌の印（light）** — 話題の保存で点数を足し、拡張点に「発信の芽」を登録する。E3の iss-00016 の後
2. **iss-00020 Xの下書き（light）** — `shipcast draft x`、プロンプト `prompts/x.md`、使った話題の消化。iss-00019 の後
:::

:::checklist E5の完了の確かめ
- fake の経路で、点数がしきい値を超えた日の日誌にだけ「発信の芽」が出る
- `shipcast draft x` で下書きができ、使った話題が消化済みになる
- 外部へ何も送らない
:::
