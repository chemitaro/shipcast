## この資料で分かること

:::summary
- ネタポイントとは何か、なぜcommitの数で数えないのか
- 「発信の芽」の印が出る条件
- Xの下書きの置き場と、消化済みの扱い
:::

## ネタポイントとは

分析のモデルが、話題ごとに「外へ伝える価値」を0〜3で付けます。基準は、変化の大きさ、読者への学び、写真や図で見せやすいか、です。

:::note commitの数で数えない理由
エージェントの開発では、作業者の数やcommitの方針しだいでcommitの数が大きく変わります。数えるのは量ではなく、話題の価値です。
:::

## 流れ

:::flow
- **ためる** — 話題を保存するときに、ネタポイントを台帳に加える {icon=plus}
- **知らせる** — 未消化の合計がしきい値（既定6）以上なら、日誌に「発信の芽」の囲み {icon=bell}
- **下書き** — `shipcast draft x --repo <id>` で、Xの本文とハッシュタグの案 {icon=pencil}
- **消化** — 下書きに使った話題を消化済みにする {icon=check}
:::

下書きは状態の置き場の `drafts/<repo>/<日付>-x.md` に置きます。外へは何も送りません。noteの記事とRedditは後に回します。

## Issueの分担

:::steps
1. **iss-00019 台帳と印** — ポイントの加算と、日誌への囲み
2. **iss-00020 Xの下書き** — プロンプトと `draft x`
:::
