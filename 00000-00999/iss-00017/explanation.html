## この資料で分かること

:::summary
- `shipcast serve` が何を返し、何を返さないか（道筋と応答の一覧）
- 1つの要求が、Hostの検査からページの包みまで、どの順に通るか
- 4つの守り（パスの検査、`<\/script` の扱い、CSP、Hostの検査）が、それぞれ何を防ぐか
- 仕様を書く途中の試作で分かり、親のEpicの案から改めた2点（`'wasm-unsafe-eval'` と `<!--` の扱い）
- 誰がどの手順を実装し、どの関門で確かめるか
:::

## 背景：なぜ「配信」が strict なのか

shipcastは、エージェントがその日の出来事から開発日誌を書く道具です。日誌は `~/.local/share/shipcast/journal/<repo>/<年>/<日付>.md` のMarkdownのファイルとして毎晩増えていきます。本人はそれを、スマートフォンやほかの端末のブラウザーで、ブログのように読みたいと考えています（本人の決定 3・11・12）。

そのために、手元のPCで小さなHTTPのサーバー `shipcast serve` を立て、Tailscaleのtailnet（本人の端末だけがつながる私的なネットワーク）から読めるようにします。

:::warning この配信は「境界」です
手元のサーバーは、同じPCの設定ファイルや鍵と同じディスクを読めます。パスの検査を1つ誤ると、tailnetの端末に `~/.ssh` の中身を返しかねません。また、日誌の本文はcommitの文や会話から作られるので、本文に混ざった `<\/script>` や `<img onerror=…>` がページの中で動く余地があります。外へ出た内容は取り消せないため、保証レベルは **`strict`** です（本人の決定 24）。
:::

:::glossary
- **tailnet**（テイルネット）: Tailscaleでつないだ、本人の端末だけの私的なネットワーク。
- **デザインシステム**: SpecDockが配る `ds.css`・`ds.js`。Markdown用の `<script>`（`id` が `ds-source`）の中のMarkdownを、部品つきのページに描く。
- **CSP**（シーエスピー）: Content-Security-Policy。ブラウザーに「このページでは、どこから来たscriptだけを動かしてよいか」を伝える応答のヘッダー。
- **DNSの付け替え**（DNS rebinding）: 外のWebページが、自分の名前の行き先を 127.0.0.1 に付け替え、手元のサーバーを自分と同じ生まれ（origin）として読む攻撃。
- **パストラバーサル**: `../` などで、決めた置き場の外のファイルを読ませる攻撃。
:::

## 道筋と応答

このIssueで返すのは、日誌の1日のページと、デザインシステムのファイルだけです。表紙と一覧は次の iss-00018 が足します。

:::datatable 道筋の一覧
| 道筋 | 返すもの | 状態 |
|---|---|---|
| `/<repo>/<YYYY-MM-DD>` | 日誌のMarkdownを包んだHTML | 200（ないと404、前付けが壊れていると500） |
| `/_ds/ds.css`・`/_ds/ds.js`・`/_ds/vendor/marked.umd.js` | デザインシステムのファイル | 200 |
| `/_ds/` の下の、許していない拡張子・ディレクトリ | なし | 404 |
| `/`・`/<repo>/` | なし（iss-00018 で表紙と一覧になる） | 404 |
| 置き場の外を指す道筋（`..`、`%2e%2e`、`%2f`、symlink など） | なし（中身を読まない） | 404 |
| `POST` などの書き込みの方法 | なし | 405 |
| Hostが手元・tailnetの名前でない要求 | なし（中身を読まない） | 400 |
:::

404と500のときも、日誌と同じデザインシステムで描いた案内のページを返します。案内には、要求された道筋やファイルの道筋を書きません。反射した文字列が、Markdownや生のHTMLとして動くのを避けるためです。

:ref[overview] のとおり、`shipcast serve` は既定で `127.0.0.1`（同じPCからしかつながらない場所）で待ち受けます。tailnetへ出すのは、本人がREADMEの手順で1回だけ実行する `tailscale serve --bg 8765` です。shipcastはTailscaleの設定を自分では変えません。

### 日誌の置き場 {icon=folder}
`journal_dir/<repo>/<YYYY>/<YYYY-MM-DD>.md`。道筋は `shipcast.model.journal_path` が決め、前付けは `parse_journal` が読みます（epic-00002 の約束）。配信は読むだけで、書きません。

### デザインシステム {icon=layers}
設定の `serve.design_system_dir`、空なら登録したrepositoryの `spec-dock/design-system/`。shipcastの中に写しません。起動のときに `ds.css` と `ds.js` を確かめ、なければ設定の仕方を示して止まります。
:::

## 1つの要求の流れ

:::flow
- **Hostを確かめる** — 手元・tailnetの名前でなければ400。ここでは何も読まない {icon=shield}
- **道筋を読む** — 生の `/` で分けてから部分ごとに1回だけ復号し、`..`・`.` で始まる部分・符号化した区切り（`%2f`・`%5c`）・NULを拒む {icon=search}
- **置き場の中か確かめる** — `resolve()` してから `is_relative_to` で比べる。外なら404 {icon=folder}
- **読む** — 日誌はUTF-8で読み、前付けの `title` を取る {icon=file}
- **包む** — `wrap_markdown` で `ds-source` に入れる {icon=code}
- **ヘッダーを付けて返す** — CSP・nosniff・no-referrer を、すべての応答に付ける {icon=checkCircle}
:::

## 4つの守り

### 守り1：パスの検査（F-02）

道筋は、2段で確かめます。1段目の `split_path` は、文字の形だけで危ないものを落とします。2段目の `resolve_inside` は、symlinkをたどった **本当の場所** が置き場の中かを確かめます。

:::beforeafter
### 文字の形だけで確かめた場合
`/_ds/notes.css` が、置き場の中にある `notes.css → ~/.ssh/id_ed25519` というsymlinkだと、文字の上では置き場の中なので返してしまいます。

### resolve() してから比べた場合
`Path.resolve()` でsymlinkをたどると `~/.ssh/id_ed25519` になり、置き場の外なので、中身を読まずに404を返します。
:::

道筋は、復号する前に生の `/` で分け、部分ごとに1回だけ復号します。`%2e%2e`（`..` を符号化したもの）は `..` の部分として落ち、`%2f`（`/` を符号化したもの）は、復号した部分の中に `/` が現れるので、置き場の中を指していても落ちます。2回符号化した `%252e` は、復号しても `%2e` という変わった名前のままで、外へは出ません。

### 守り2：`<\/script` と `<!--` の扱い（F-03）

デザインシステムは、Markdownを `<script type="text/markdown">` の中に置きます。HTMLの仕様では、この中身は `<\/script` が来たところで閉じます。そのため、日誌の本文に `<\/script><script>…` という文字が混ざっていると、そこで包みが閉じ、後ろが本物のscriptになってしまいます。

`wrap_markdown` は、本文の中の `<\/script` の `<` と `/` の間に、バックスラッシュを1つ入れます。閉じのタグの形でなくなるので、包みは閉じません。`ds.js` は読むときにバックスラッシュを外すので、ページには元の文字のまま表示されます。ただし、本文に元からバックスラッシュ付きで書いた閉じのタグは、同じ戻しでバックスラッシュが消えて表示されます。これは ds.js の仕組みによるもので、避けられません。

:::note もう1つの落とし穴：`<!--` の後の `<script`
HTMLの仕様には、`<script>` の中身に `<!--` があり、その後に `<script` が来ると、次の閉じのタグを閉じとして扱わない状態（script data double escaped state）があります。本文に閉じていない `<!--` と `<script` があると、包みの閉じが効かず、`ds.js` の読み込みまで本文に飲み込まれ、ページが空になります。
:::

親のEpicの案では、`<!--` を `<\!--` に置き換える方法でした。仕様を書く途中で試作して、ブラウザーで確かめたところ、次のことが分かりました。

:::decision `<!--` を置き換えず、本文の末尾に閉じのコメントを足す status=案（仕様レビュー中） date=2026-11-26
### 決定
`<!--` はそのままにし、包む本文の末尾に、改行・`<!-- -->`・改行を足します。
### 理由
- `ds.js` は、バックスラッシュを入れた閉じのタグだけを戻し、`<\!--` は戻しません。そのため本文の中のHTMLのコメントが、見える文字になりました。
- さらに、コメントの中に書いた `<script>` が生のHTMLとして解釈され、後ろの本文（図を含む）を飲み込みました（試作で確認）。
- 末尾の `<!-- -->` は、トークナイザーがどの状態にいても、通常の状態に戻します。Markdownの上では見えないコメントなので、本文の見た目を変えません。
### 採用しなかった案
- `<!--` を `<\!--` に置き換える（親のEpicの案）：上の理由で、本文の意味が変わる。
- `<script` も置き換える：`ds.js` が戻さないので、本文に `<\script` という文字が出る。
### 影響
本文が、閉じていないコードの囲みで終わる日誌だけは、コードの中に `<!-- -->` が見えます。報告の残りのリスクに書きます。
:::

置き換えはASCIIの大文字小文字だけを同じとみなします（`re.ASCII`）。HTMLの仕様と `ds.js` の戻し方がASCIIだけを同じとみなすので、そろえないと、`ſ` のような字を含む文字列だけが置き換わって戻らない、というずれが起きます。

### 守り3：CSP（F-04）

デザインシステムのMarkdownは、本文に書かれた生のHTMLをそのまま描きます。本文に `<img src=x onerror="…">` が混ざると、そのままでは画像の読み込みの失敗でscriptが動きます。これは、すべての応答に付けるCSPで止めます。

```text title="すべての応答に付けるヘッダー"
Content-Security-Policy: default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://unpkg.com/@plantuml/core@1.2026.6/ https://unpkg.com/@highlightjs/cdn-assets@11.11.1/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'
X-Content-Type-Options: nosniff
Referrer-Policy: no-referrer
```

:::keyvalue cols=1
- `script-src 'self' 'wasm-unsafe-eval' https://unpkg.com/@plantuml/core@1.2026.6/ …` | 自分の `ds.js` と、unpkg.com の **決まった版の2つの道筋** の部品だけを動かす。インラインのscriptとイベントの属性（`onerror` など）は動かない
- `'wasm-unsafe-eval'` | PlantUMLの図の部品がWebAssemblyで動くために要る。`'unsafe-eval'`（文字列からscriptを作る）は許さない
- `style-src 'unsafe-inline'` | `ds.js` が部品に `style` の属性を書くので要る
- `img-src 'self' data:` | 本文の画像で外へ情報を送らせない
- `form-action 'none'` | 本文に混ざった `<form>` で、外へ送らせない
- `Referrer-Policy: no-referrer` | 日誌のURLとtailnetの名前を、unpkg.com やGoogleのフォントへ送らない
:::

:::success 試作で確かめたこと（2026-11-26）
親のEpicのCSP（`'wasm-unsafe-eval'` なし）では、図が `CompileError: WebAssembly.instantiate(): … violates the following Content Security policy directive` で描けませんでした。`'wasm-unsafe-eval'` を足すと、図・コードの色分け・部品が描け、`<img onerror>` は動かず、`<\/script>` を含むコードは文字のまま表示されました。
:::

:::danger 最終品質ゲートで見つかった穴：部品の読み込み先の差し替え
はじめは unpkg.com のオリジン全体をscriptに許していました。ところが ds.js は、本文を文書に入れた後に `meta[name="ds-vendor-base"]` を探して、図と色分けの部品をそこから読みます。日誌の本文に `<meta name="ds-vendor-base" content="https://unpkg.com/誰かのパッケージ/">` が混ざると、第三者が unpkg に置いたscriptが日誌のページで動きえました（最終品質ゲートの ChatGPT の2人目の指摘。ヘッドレスの Chrome で要求が出ることを再現）。いまは unpkg.com の中でも、ds.js が読む決まった版の2つの道筋だけを許すので、差し替えた先はCSPで拒まれ、ds.js は決まった版から読み直します。
:::

ヘッダーは、配信のハンドラーの `end_headers()` という **1つの出口** で付けます。404や405、標準ライブラリが自分で返すエラー（501など）も、必ずこの出口を通るので、付け忘れが起きません。

### 守り4：Hostの検査（F-05）

127.0.0.1 で待ち受けていても、本人のブラウザーは手元のサーバーにつながれます。DNSの付け替えでは、本人が開いた外のWebページ `evil.example` が、自分の名前の行き先を 127.0.0.1 に変え、手元の日誌を「同じ生まれ」として読みます。このとき、要求のHostのヘッダーには `evil.example` が入ります。

:::compare 推奨=許す
| Hostの例 | 許す | 理由 |
|---|---|---|
| `127.0.0.1:8765`・`[::1]:8765` | ✓ | IPの書き方は、外のページが自分の名前として使えない |
| `localhost` | ✓ | 手元の名前 |
| `mac.tail1234.ts.net` | ✓ | `tailscale serve` の名前 |
| `mac` | ✗ | 点のない1語の名前は、ネットワークのDNSの検索ドメインで外の名前に解決されうる |
| `evil.example` | ✗ | 外の名前。付け替えの攻撃で入る |
| `ts.net.evil.example` | ✗ | `.ts.net` で終わらない |
:::

## 確かめ方

:::terminal title="手元で流す検査（CIと同じ順）"
$ uv sync --locked
$ uv run ruff check
$ uv run pytest -q
$ uv run shipcast serve --help
:::

自動の試験は、HTTPのクライアントが正規化しない生の道筋（`/_ds/%2e%2e/x` など）を、`http.client` で直接送って確かめます。ブラウザーでの描画（T-07）は、S-04 で Orca の組み込みのブラウザーを使って手で確かめ、画面の写しと結果を報告に残します。

:::risks
| リスク | 影響 | 起きやすさ | 対応 |
|---|---|---|---|
| デザインシステムが将来、別のCDNやインラインのscriptを使う | 中 | 低 | T-07 の確かめで気づき、最小の許可を足す |
| CSPの unpkg の道筋が ds.js の部品の版に結び付く | 中 | 中 | 試験で ds.js の版とCSPがそろうことを確かめる。版を上げるときは同じ変更でCSPを直す |
| `.ts.net` でない独自の名前で読みたくなる | 低 | 低 | 許す名前を設定に足す（別のIssue） |
| 閉じていないコードの囲みで終わる日誌 | 低 | 低 | コードの中に `<!-- -->` が見えるだけ |
:::
