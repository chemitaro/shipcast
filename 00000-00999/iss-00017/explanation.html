## このIssueで作るもの

`shipcast serve` で、日誌のMarkdownをデザインシステムで描くページとして返します。親のE4の説明資料に、全体の約束と背景があります。

:::summary 確かめる点
- `<\/script>` を含むMarkdownも壊れない
- 置き場の外のpathは返さない
- READMEにTailscaleの手順
:::

:::note 保証レベルと前提の更新（2026-11-26）
保証レベルは **`strict`** です。tailnetから読まれるHTTPの配信の境界なので `strict` にしました。パスの検査（`..`・符号化・symlink）、`</script` と `<!--` の置き換え、CSPのヘッダーを1か所ずつの関数にします。ページの枠と見た目は、本人の方針で Opus 5.5 が直接実装します。
:::

要件・設計・計画の正本は、同じフォルダーの `requirement.cue`、`design.cue`、`plan.cue` です。
