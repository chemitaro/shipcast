## このIssueで作るもの

SpecDockのCLIの機械向けの出力から、その日のScopeの作成・終了と、本人待ちのtodoを集めます。親のE2の説明資料に、全体の約束と背景があります。

:::summary 確かめる点
- 最初に実際の出力を確かめ、見本として置く
- カタログの内部の形は解釈しない
:::

:::note 保証レベルと前提の更新（2026-11-26）
保証レベルは **`light`** です。Scopeの作成日・終了日は、`spec-dock scope list` の出力に時刻がないため、`gh issue list --state all --json number,title,state,createdAt,closedAt,url`（読むだけ）で取ります。todoは `spec-dock todo list --status all --json` で読みます。iss-00011 の共通の約束の後に始めます。
:::

要件・設計・計画の正本は、同じフォルダーの `requirement.cue`、`design.cue`、`plan.cue` です。
